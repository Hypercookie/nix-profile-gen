default_scope = "nix-darwin"

[scopes.nix-darwin]
description = "programs.appleProfile options (standalone)"

options-list-cmd = '''
nix eval --impure  --json   --expr '
    let
      pkgs = import <nixpkgs> {};
      lib = pkgs.lib;

      # The profile module has no Home Manager dependency, so it is
      # evaluated on its own. `prefix` makes every option show up under the
      # path users write, with a literal <name> for the profile.
      prefix = [ "programs" "appleProfile" "profiles" "<name>" ];

      eval = lib.evalModules {
        inherit prefix;
        specialArgs = { inherit pkgs; hmConfig = { }; };
        modules = [ ./nix-modules/profile ];
      };

      visible = o: (o.visible or true) && !(o.internal or false);

      # Profile options (platform, profileName, scope, bridges ...) plus the
      # payload manifest options as a single entry each.
      baseList = builtins.filter visible (lib.optionAttrSetToDocList eval.options);

      # Expanded so that keys are visible when typing
      # programs.appleProfile.profiles.<name>.payloads.<manifest>.<instance>.<key>.
      payloadOpts = eval.options.payloads;

      expandPayload = manifestName:
        let
          # attrsOf.getSubOptions appends <name> internally, so the prefix must
          # end at the manifest name itself.
          loc = prefix ++ [ "payloads" manifestName ];
          sub = payloadOpts.${manifestName}.type.getSubOptions loc;
        in
        builtins.filter visible (lib.optionAttrSetToDocList sub);

      expandedList = lib.concatMap expandPayload (builtins.attrNames payloadOpts);
    in
      baseList ++ expandedList
  '
'''
